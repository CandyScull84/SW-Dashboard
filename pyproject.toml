[project]
name = "sw-dashboard"
version = "0.1.0"
description = "Dashboard displaying open merge requests, active projects with pushes, and failing GitLab pipelines."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3",
    "urllib3>=2.3.0",
    "python-dotenv>=1.1.1",
    "fastapi>=0.120.0",     
    "uvicorn>=0.38.0",
    "pytz>=2025.2",
    "httpx>=0.28.1",
]

[project.scripts]
sw-dashboard = "sw_dashboard:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
